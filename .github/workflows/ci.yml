# Lint and test on every push and pull request.
#
# Each job only runs when its own paths changed (see the `changes` job, which
# uses dorny/paths-filter). A skipped job still reports as a passing check, so
# this is safe to use as a required status check.
#
# Deliberately cheap: each job installs the one pixi environment it needs. The
# heavy ones (`analysis`, `notebooks`, `dx`) are not exercised here -- if a job
# ever needs one, add a separate job rather than growing this matrix, so a broken
# plotting dependency can never block a pipeline fix.
#
# The Docker images are built by docker.yml, manually. Nothing here builds them.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to a PR cancels the run still going for the previous one.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      backend: ${{ steps.filter.outputs.backend }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'src/python/**'
              - 'tests/python/**'
              - 'pyproject.toml'
              - 'pixi.lock'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'pyproject.toml'
              - 'pixi.lock'
              - '.github/workflows/ci.yml'
            shell:
              - 'scripts/**/*.sh'
              - '.github/workflows/ci.yml'

  python:
    name: Python (lint + tests)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # locked: fail if pixi.lock disagrees with the manifests rather than
      # silently resolving something else. That is the whole point of committing
      # the lockfile -- CI must install exactly what a contributor installs.
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: default
          locked: true
          cache: true

      - name: Lint
        run: pixi run lint-pipeline

      - name: Tests
        run: pixi run test-pipeline

  python-heavy-groups:
    # The heavy groups (`modeling`, `compression`) are not installed by the
    # `python` job above, so their tests skip there via `pytest.importorskip`.
    # This job installs them and re-runs the suite so those tests actually
    # execute somewhere -- untested code is not worth writing.
    name: Python (modeling + compression groups)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen --group modeling --group compression

      - name: Tests
        run: uv run pytest -q

  backend:
    name: Backend (lint + tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `backend` is a standalone environment in the one workspace: its own
      # Python, sharing nothing with the pipeline. See pyproject.toml. The tasks run
      # themselves from backend/, so this job does not change directory.
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: backend
          locked: true
          cache: true

      - name: Lint
        run: pixi run lint-backend

      - name: Tests
        run: pixi run test-backend

  shell:
    name: Shell scripts
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every .sh in the repo now lives under scripts/, so one glob covers them.
      - name: shellcheck
        run: shellcheck --severity=error $(git ls-files 'scripts/**/*.sh')
